<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Radar 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'media' }</script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen">
  <div id="banner" class="hidden bg-red-600 text-white text-sm text-center py-2 px-4" role="alert"></div>

  <header class="max-w-6xl mx-auto px-4 pt-6 pb-2 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">📡 AI Radar</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">GitHub · Hacker News · 카카오톡 AI 오픈채팅 동향 레이더</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn-top5-trigger px-3.5 py-2 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white transition-all cursor-pointer flex items-center gap-1.5 shadow-md" title="오늘 최고 점수 받은 글 5개씩(전체글 및 카카오톡) 정리하고 .md 파일로 저장">📊 오늘 TOP 5 브리핑 저장 (.md)</button>
      <span id="clock" class="text-xs text-slate-400"></span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pb-12 space-y-6">
    <!-- 상태 카드 -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-4" aria-label="실시간 통계">
      <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-sm p-4">
        <p class="text-xs text-slate-500 dark:text-slate-400">수집 상태</p>
        <p id="card-status" class="text-2xl font-semibold mt-1">…</p>
        <p id="card-status-sub" class="text-xs text-slate-400 mt-1">&nbsp;</p>
      </div>
      <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-sm p-4">
        <p class="text-xs text-slate-500 dark:text-slate-400">다음 수집까지</p>
        <p class="text-2xl font-semibold mt-1"><span id="countdown">--</span><span class="text-base font-normal text-slate-400"> 초</span></p>
        <div class="h-2 rounded-full bg-slate-200 dark:bg-slate-700 mt-2 overflow-hidden" role="progressbar" aria-label="다음 수집까지 남은 시간">
          <div id="gauge" class="h-2 rounded-full bg-indigo-500 transition-all duration-1000 ease-linear" style="width:0%"></div>
        </div>
      </div>
      <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-sm p-4">
        <p class="text-xs text-slate-500 dark:text-slate-400">24시간 신규 / 전체</p>
        <p class="text-2xl font-semibold mt-1"><span id="card-new">0</span><span class="text-base font-normal text-slate-400"> / <span id="card-total">0</span></span></p>
        <p id="card-sources" class="text-xs text-slate-400 mt-1">&nbsp;</p>
      </div>
      <div class="rounded-2xl bg-white dark:bg-slate-800 shadow-sm p-4">
        <p class="text-xs text-slate-500 dark:text-slate-400">수집 성공률 (1시간)</p>
        <p id="card-rate" class="text-2xl font-semibold mt-1">-</p>
        <p id="card-slack" class="text-xs text-slate-400 mt-1">&nbsp;</p>
      </div>
    </section>

    <!-- 피드 -->
    <section class="rounded-2xl bg-white dark:bg-slate-800 shadow-sm">
      <div class="flex flex-wrap items-center gap-2 p-4 border-b border-slate-100 dark:border-slate-700">
        <h2 class="font-semibold mr-2">실시간 피드</h2>
        <div id="tabs" class="flex gap-1 text-sm"></div>
        <div id="scope" class="flex gap-1 text-sm ml-auto" role="group" aria-label="점수 필터"></div>
        <button id="btn-top5" class="btn-top5-trigger px-3 py-1.5 text-xs font-bold rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white transition-all cursor-pointer flex items-center gap-1 shadow-sm shrink-0" title="오늘 최고 점수 받은 글 5개씩(전체글 및 카카오톡) 정리하고 .md 파일로 저장">📊 오늘 TOP 5 브리핑 저장</button>
      </div>
      <ul id="feed" class="divide-y divide-slate-100 dark:divide-slate-700">
        <li class="p-6 text-center text-slate-400 text-sm">불러오는 중…</li>
      </ul>
    </section>

    <!-- 수집 로그 -->
    <section class="rounded-2xl bg-white dark:bg-slate-800 shadow-sm overflow-hidden">
      <h2 class="font-semibold p-4 border-b border-slate-100 dark:border-slate-700">수집 로그</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-left text-xs text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-900/40">
            <tr><th class="px-4 py-2">시각</th><th class="px-4 py-2">소스</th><th class="px-4 py-2 text-right">조회</th><th class="px-4 py-2 text-right">신규</th><th class="px-4 py-2">상태</th><th class="px-4 py-2">오류</th></tr>
          </thead>
          <tbody id="runs"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js?v=20261107_05"></script>
</body>
</html>
